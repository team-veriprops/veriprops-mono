# CI + deploy pipeline for pushes:
#   push to master → full CI → production deploy of both Vercel projects
#   push to dev    → full CI → preview deploy aliased to the stable dev domain
#   workflow_dispatch (environment=staging) → full CI → preview deploy aliased
#     to the staging domain (run it from the ref you want promoted)
#
# Database migrations run here — an explicit, serialized, CI-gated step before the
# backend deploy — not in Vercel's buildCommand (a build is not a release: preview
# builds must never move schema, and Vercel rollbacks don't downgrade schema).
# The step runs `doppler run -- alembic upgrade head` under an environment-scoped
# Doppler service token: alembic imports Settings, whose prod/staging validators
# require the real secret set, and Doppler stays the single secret store (GitHub
# holds only the token). Both vercel.json files set git.deploymentEnabled=false so
# this pipeline is the only deploy path — an out-of-band deploy would skip migrations.
# deploy-frontend needs deploy-backend: API first, and a failed migration blocks both.
#
# Custom domains:
#   - dev/staging: each preview deploy is aliased to a stable domain right here
#     (previews never get custom domains any other way). Defaults are hardcoded
#     below (api-dev.veriprops.ng / dev.veriprops.ng, api-staging.veriprops.ng /
#     staging.veriprops.ng); the repo variables BACKEND_DEV_ALIAS,
#     FRONTEND_DEV_ALIAS, BACKEND_STAGING_ALIAS, FRONTEND_STAGING_ALIAS are
#     optional overrides. The veriprops.ng zone lives on Cloudflare and its
#     records stay PROXIED (orange cloud) as a deliberate security layer; the
#     Cloudflare record behind the proxy must point at Vercel
#     (CNAME cname.vercel-dns.com) for `vercel alias set` to succeed. A brand-new
#     host's first certificate may fail to issue through the proxy — set that
#     record to "DNS only" once, re-run the alias, then flip it back to proxied.
#   - production: deliberately NOT aliased here. Production domains are a Vercel
#     project setting (one-time dashboard step: veriprops.ng + www.veriprops.ng
#     with www→apex redirect on the frontend project, api.veriprops.ng on the
#     backend project) — every `vercel deploy --prod` repoints them natively,
#     including dashboard instant-rollbacks, and only the dashboard can express
#     the www redirect.
#
# Required repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID,
#   VERCEL_PROJECT_ID_BACKEND, VERCEL_PROJECT_ID_FRONTEND.
# Required environment-scoped secret (in each of the production/dev/staging
#   GitHub Environments): DOPPLER_TOKEN — a read-only Doppler service token for
#   the matching Doppler config (prd/dev/stg).
name: Deploy

on:
  push:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote this ref to
        type: choice
        options: [staging]
        required: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a mid-flight deploy/migration

jobs:
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml
  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml

  deploy-backend:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'master' && 'production' || 'dev') }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - uses: dopplerhq/cli-action@v3
      - name: Run database migrations
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # Env-file selector (prod/staging/dev) — mirrors the job's `environment`
          # ternary but maps to .env.{name} file names ('prod', not 'production').
          appodus_active_env: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'master' && 'prod' || 'dev') }}
        # The DB_NAME echo resolves through Settings (env file + Doppler precedence),
        # not the raw shell env — it shows the database alembic will actually migrate.
        run: |
          echo "appodus_active_env=${appodus_active_env}"
          doppler run -- python -c "from main.app.config.settings import settings; print(f'DB_NAME={settings.DB_NAME}')"
          doppler run -- alembic upgrade head
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy production
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: vercel deploy --prod --yes --cwd backend --token "$VERCEL_TOKEN" --env appodus_active_env=prod
      - name: Deploy preview + stable alias
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'dev'
        env:
          # Repo variables override the hardcoded stable domains (see header).
          ALIAS: ${{ github.event_name == 'workflow_dispatch' && (vars.BACKEND_STAGING_ALIAS || 'api-staging.veriprops.ng') || (vars.BACKEND_DEV_ALIAS || 'api-dev.veriprops.ng') }}
          # Mirrors the migration step's env-file selector above — without this, the
          # deployed function falls back to `dev_personal` (DB_SERVER=localhost),
          # which the serverless sandbox can't reach: ECONNREFUSED on cold start.
          ACTIVE_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          url=$(vercel deploy --yes --cwd backend --token "$VERCEL_TOKEN" --env appodus_active_env="$ACTIVE_ENV")
          echo "deployed $url"
          vercel alias set "$url" "$ALIAS" --token "$VERCEL_TOKEN"

  deploy-frontend:
    # deploy-backend included: the API (and its migrations) must land first,
    # and a failed migration blocks the frontend release too.
    needs: [backend-ci, frontend-ci, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'master' && 'production' || 'dev') }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy production
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: vercel deploy --prod --yes --cwd frontend --token "$VERCEL_TOKEN"
      - name: Deploy preview + stable alias
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'dev'
        env:
          # Repo variables override the hardcoded stable domains (see header).
          ALIAS: ${{ github.event_name == 'workflow_dispatch' && (vars.FRONTEND_STAGING_ALIAS || 'staging.veriprops.ng') || (vars.FRONTEND_DEV_ALIAS || 'dev.veriprops.ng') }}
        run: |
          url=$(vercel deploy --yes --cwd frontend --token "$VERCEL_TOKEN")
          echo "deployed $url"
          vercel alias set "$url" "$ALIAS" --token "$VERCEL_TOKEN"
