# Full-stack live drive-through (backend/scripts/e2e_drive_through.py):
# boots Postgres + Mailpit + the real backend, then runs the cradle-to-grave
# scenario over HTTP (signup → verification → payment → review → release →
# disputes → payouts → messaging retries → …).
#
# Then the browser suite (frontend/e2e) against that same stack. It runs here
# rather than in frontend-ci because it needs the real backend, and it reuses
# this job's Postgres/Mailpit/backend instead of standing up a second copy —
# its globalSetup resets and re-seeds, so the drive-through's data is no
# obstacle. Two engines (docs/uat-strategy.md §7's `@P1` pair) rather than the
# full six-permutation matrix, which stays a local/nightly concern: one desktop
# and one mobile engine from different rendering families is what catches the
# engine-specific breakage that lint, types and unit tests cannot see.
#
# Slow and stateful, so it never triggers on PRs directly: pull_requests.yml
# calls it (path-gated) as a blocking gate on every code PR, deploy.yml calls
# it as the release gate for every push to dev/staging/master, and it also
# runs nightly and on demand. The concurrency group below applies only to the
# direct schedule/dispatch runs — workflow_call runs use the caller's group.
name: E2E

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veriprops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veriprops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APPODUS_ACTIVE_ENV: test
      DB_PASSWORD: postgres # overrides .env.test's CHANGE_ME
      ENABLE_OUT_MESSAGING: "True" # email → Mailpit, SMS → mock provider
      MAILPIT_CONTAINER: mailpit # stage_messaging_retry docker stop/starts this
      PYTHONIOENCODING: utf-8
      # To enable webhooks drive_through
      WHATSAPP_APP_SECRET_KEY: "WHATSAPP_APP_SECRET_KEY"
      WHATSAPP_BUSINESS_WEBHOOK_VERIFY_TOKEN: "WHATSAPP_BUSINESS_WEBHOOK_VERIFY_TOKEN"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Named `docker run` (not a service container) so the messaging_retry stage
      # can stop/start it by name to induce a real SMTP failure.
      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest

      - run: pip install -r requirements.txt

      - run: alembic upgrade head

      - name: Launch backend
        run: |
          nohup python veriprops.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "backend healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend never became healthy"
          tail -100 /tmp/backend.log
          exit 1

      - name: Run drive-through
        run: python scripts/e2e_drive_through.py

      # ── Browser suite (docs/uat-strategy.md) ──────────────────────────────
      # Reads the pinned version from frontend/package.json's packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches frontend/Dockerfile
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # `NEXT_PUBLIC_ENVIRONMENT=test` is what turns on the automation window hooks
      # the suite waits on (`isAutomationEnvironment()`); without it every spec
      # hangs on `__app_ready__`.
      - name: Build the frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_ENVIRONMENT: test
          API_BASE_URL: http://localhost:8000
          BACKEND_SECRET_KEY: ci-build-placeholder
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      # §9's stack: the standalone server on :3001 behind a TLS front on :3000.
      # `next start` does not serve the standalone output, and the static assets
      # are not copied into it by the build.
      - name: Serve the build
        working-directory: frontend
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cd .next/standalone
          API_BASE_URL=http://localhost:8000 PORT=3001 HOSTNAME=0.0.0.0             nohup node server.js > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3001 > /dev/null && exit 0
            sleep 2
          done
          echo "::error::the standalone frontend never came up"
          tail -100 /tmp/frontend.log
          exit 1

      # The session cookies are `__Host-`/Secure, and WebKit drops them over plain
      # http — so the suite is served over TLS even locally. `host-gateway` is how
      # the container reaches the host's :3001 on a Linux runner.
      - name: Start the TLS front
        working-directory: frontend
        run: |
          docker run -d --name veriprops-uat-tls -p 3000:3000             --add-host=host.docker.internal:host-gateway             -v "$PWD/e2e/tls/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          for i in $(seq 1 30); do
            curl -fsSk https://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "::error::the TLS front never came up"
          docker logs veriprops-uat-tls
          exit 1

      - name: Install browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run the browser suite
        working-directory: frontend
        env:
          UAT_ENGINES: chromium-desktop,webkit-mobile
        run: node e2e/run-lanes.mjs

      - name: Upload logs and the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            frontend/e2e/playwright-report
            frontend/e2e/test-results
          retention-days: 7
