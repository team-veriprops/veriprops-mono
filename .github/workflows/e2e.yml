# Full-stack live drive-through (backend/scripts/e2e_drive_through.py):
# boots Postgres + Mailpit + the real backend, then runs the cradle-to-grave
# scenario over HTTP (signup → verification → payment → review → release →
# disputes → payouts → messaging retries → …).
#
# Slow and stateful, so it never triggers on PRs directly: pull_requests.yml
# calls it (path-gated) as a blocking gate on every code PR, deploy.yml calls
# it as the release gate for every push to dev/staging/master, and it also
# runs nightly and on demand. The concurrency group below applies only to the
# direct schedule/dispatch runs — workflow_call runs use the caller's group.
name: E2E

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veriprops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veriprops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APPODUS_ACTIVE_ENV: test
      DB_PASSWORD: postgres # overrides .env.test's CHANGE_ME
      ENABLE_OUT_MESSAGING: "True" # email → Mailpit, SMS → mock provider
      MAILPIT_CONTAINER: mailpit # stage_messaging_retry docker stop/starts this
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Named `docker run` (not a service container) so the messaging_retry stage
      # can stop/start it by name to induce a real SMTP failure.
      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest

      - run: pip install -r requirements.txt

      - run: alembic upgrade head

      - name: Launch backend
        run: |
          nohup python veriprops.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "backend healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend never became healthy"
          tail -100 /tmp/backend.log
          exit 1

      - name: Run drive-through
        run: python scripts/e2e_drive_through.py

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: /tmp/backend.log
          retention-days: 7
