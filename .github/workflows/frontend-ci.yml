# Frontend quality gates: eslint, tsc, vitest, next build.
#
# Reusable-only (workflow_call): PRs run it through pull_requests.yml, pushes
# to dev/staging/master through deploy.yml. Deliberately no direct
# `pull_request:`/`push:` trigger — either would double-run CI (see
# backend-ci.yml for the full packaging notes).
name: Frontend CI

on:
  workflow_call:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # next.config.ts reads these through src/lib/config/server.ts at build time;
      # real values are Doppler-managed on Vercel — CI only needs them present.
      API_BASE_URL: http://localhost:8000
      BACKEND_SECRET_KEY: ci-build-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned version from frontend/package.json's packageManager field
      # (action-setup defaults to the repo-root package.json, which doesn't exist here).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches frontend/Dockerfile
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  summary:
    if: always()
    needs: [changes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
