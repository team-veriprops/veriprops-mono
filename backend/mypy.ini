# Type-check baseline for CI (mypy). Deliberately lenient day-one config for an
# existing codebase. Ratchet stricter over time.
#
# Kept out of pyproject.toml on purpose: Vercel's Python builder treats a
# pyproject.toml as a dependency manifest and runs `uv lock` against it, which
# fails without a [project] table. This repo's dependencies stay in
# requirements.txt (see CLAUDE.md package-manager convention).

[mypy]
python_version = 3.12
files = main
exclude = (\.venv313|main/alembic/versions)
ignore_missing_imports = True
follow_imports = silent
; Baseline = only obvious breakage; Kink DI + SQLAlchemy dynamics defeat strict modes.
check_untyped_defs = False
warn_unused_ignores = False
allow_redefinition = True
implicit_optional = True
; The classic (non-Mapped) SQLAlchemy models type instance attrs as Column[T],
; which floods arg-type/return-value/call-arg everywhere a service passes ORM
; attrs around. Until models migrate to Mapped[], those codes stay off; what
; remains still catches undefined names, bad imports/operators, and signature typos.
disable_error_code =
    var-annotated,
    assignment,
    union-attr,
    attr-defined,
    misc,
    arg-type,
    call-arg,
    return-value,
    type-var,
    override,
    valid-type,
    return,
    call-overload,
    no-redef,
    import-untyped
