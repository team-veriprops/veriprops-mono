# Lint / type-check baseline for CI (ruff + mypy).
# Deliberately lenient day-one config for an existing codebase — correctness
# rules only (pyflakes + pycodestyle error classes). Ratchet stricter over time.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".venv313",              # in-tree local venv
    "main/alembic/versions", # migrations stay decoupled from app lint rules
    "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]
ignore = [
    "E731", # lambda assignment — used in DI/config wiring
    "E741", # ambiguous single-letter names
    "E711", # `== None` on SQLAlchemy columns builds SQL, `is None` would not
    "E712", # `== False` on SQLAlchemy columns builds SQL, `not x` would not
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # domain package hierarchy re-exports
"conftest.py" = ["E402", "F401"] # env bootstrap must precede main.* imports
"main/alembic/env.py" = ["F401"] # main.app.domain/core imported so Alembic sees every model
"api/index.py" = ["F401"] # re-exports `app` as the Vercel serverless entrypoint

[tool.mypy]
python_version = "3.12"
files = ["main"]
exclude = '(\.venv313|main/alembic/versions)'
ignore_missing_imports = true
follow_imports = "silent"
# Baseline = only obvious breakage; Kink DI + SQLAlchemy dynamics defeat strict modes.
check_untyped_defs = false
warn_unused_ignores = false
allow_redefinition = true
implicit_optional = true
# The classic (non-Mapped) SQLAlchemy models type instance attrs as Column[T],
# which floods arg-type/return-value/call-arg everywhere a service passes ORM
# attrs around. Until models migrate to Mapped[], those codes stay off; what
# remains still catches undefined names, bad imports/operators, and signature typos.
disable_error_code = [
    "var-annotated",
    "assignment",
    "union-attr",
    "attr-defined",
    "misc",
    "arg-type",
    "call-arg",
    "return-value",
    "type-var",
    "override",
    "valid-type",
    "return",
    "call-overload",
    "no-redef",
    "import-untyped", # installed-but-stubless third-party imports (pairs with ignore_missing_imports)
]
