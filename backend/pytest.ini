[pytest]
testpaths = test
asyncio_mode = auto
markers =
    subscriber_faults_expected: the test deliberately makes an event-bus subscriber fail (see conftest.subscriber_faults)
filterwarnings =
    # passlib (unmaintained) reads argon2.__version__; nothing in this repo can change that.
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib.handlers.argon2
    # fastapi.testclient wraps starlette's httpx client and suggests swapping in a new package;
    # that is a dependency decision, not a test-suite one.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
