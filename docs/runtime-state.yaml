       coroutines, and `test_decorated_service_contract.py` fails on any of them. A census across
       143 decorated services found **zero** remaining, so the guard starts clean."
    - "The `AuthJWT` dependency declares a header parameter named `token`; a path param of the
       same name makes FastAPI refuse to build the route. `/wa/intake/{handoff_token}/redeem`."
