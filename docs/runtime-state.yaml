self_audit:
  started: true
  completed: true
  findings:
    - "**S10.0 — a whole spec row with no producer.** §26.3.4 marks three actions `HANDOFF`;
       only `upload` had one. `capabilities.handoff_intent_for` had **zero callers**, no
       `BotIntent` reached `PAY` or `VIEW_REPORT`, and both fell through to the unmatched
       counter — so `/wa/pay/<token>` and `/wa/report/<token>`, fully built on both ends, were
       unreachable from a real conversation. backend/CLAUDE.md already claimed the bot minted
       report tokens on request, and D75's rationale rested on it; the claim is now true."
    - "**Four defects only the live drive-through could catch.** (1) Pay eligibility named
       `PAYMENT_PENDING`, which reads right and is the narrow in-flight state — a customer
       asking to pay is almost always at `SUBMITTED` → `INTAKE_COMPLETE`, so every unit test
       passed while the bot offered nothing to anyone who asked. (2) Grouping by an expression
       containing a literal made SQLAlchemy bind it once for the select list and again for the
       GROUP BY; Postgres saw two expressions and rejected the query. (3) Page-code extraction
       sat in the Meta normalizer, which `POST /dev/whatsapp/inbound` bypasses — attribution
       worked in production and never in an automated run, the exact split the
       automation-determinism contract exists to prevent. (4) A drive-through assertion assumed
       the stage customer owned no delivered case, when they own the one `stage_report` released."
    - "**The §26.3.2 projection has a trap in a name.** `ChannelState.REPORT_READY` projects from
       `UNDER_REVIEW`, where the report exists but has not passed the §8 release gate. Reading
       'a report exists' as 'the customer may have it' would have handed out the very draft the
       gate holds back, so `VIEW_REPORT` offers `DELIVERED` only."
    - "**NDPA erasure missed the entire channel.** `PiiPseudonymiser` covered eight surfaces and
       none was a channel table: an approved erasure left the subject's number in
       `whatsapp_links`, `whatsapp_bot_sessions`, `whatsapp_inbound_messages`, `case_delegates`
       and `handoff_token_redemptions`, and their half-finished chat intake — addresses included
       — in the session `context`. Found by reading §26.8 against the code rather than by a test."
    - "**§26.8's 'consent records exportable' was unimplemented.** The §19.3 audit pack read
       `user_consents` and not `whatsapp_consents`, so the one export a dispute or a regulator
       asks for could not show whether the customer had agreed to be messaged, or when they
       withdrew it."
    - "**The requirements matrix had been wrong for two slices.** Sixteen rows delivered in S5
       and S6 still read `pending`. Traceability that is not maintained is worse than none: it
       reports work as missing and invites it to be redone. Now 42 of 44 complete, with the two
       partials genuinely blocked on Meta."
    - "**The failure-fallback gate was being claimed by unit tests.** §26.11 asks for the fallback
       to be *tested* — kill the bot, observe the auto-reply and the alert. Mocks prove the
       `except` branch behaves; they cannot prove a real failure reaches it rather than becoming
       a 500 in the webhook, a Meta retry, and silence. `app/core/fault_injection.py` makes one
       real turn fail, one-shot, and refuses to arm in production."
    - "A drive-through assertion demanded an hour figure in the failure copy. Decision G gives
       the promise two shapes — 'joining now' inside staffed hours, a stated window outside —
       and the first is the stronger. The assertion was wrong, not the copy."

