self_audit:
  started: false
  completed: false
  findings:
    - "S7 shipped 2026-09-02 (3c53bd2) — drive-through green at 372 checks."
    - "D75 (user): `report_ready` carries the portal deep link, not a §7.5 token. A token
       lives 15 minutes and a milestone is read whenever the customer next opens WhatsApp,
       so a token would make §7.4.2's expiry page the normal experience rather than an edge
       case. WA-35's wording is amended in the matrix to match."
    - "D76 (user): both payment surfaces capture the §7.4.6 consents. The handoff-landing
       payer is the channel's own customer and would otherwise never be asked. The landing's
       write is grant-scoped — customer id from the cookie, never the body — and consent is
       written on toggle, so a failed card cannot discard it."
    - "D77 (user): STOP from a delegate-only number revokes the delegation and notifies the
       account holder. A delegate has no consent row, so it is the only lever a non-user has,
       and the buyer's useful response is to authorize someone else."
    - "**D78 — a defect only the live drive-through could catch.** `verification_started` went
       out **three times** on a STANDARD case. `derive_status` is a memoryless projection: a
       case drops back to PAID when its one active task is submitted and re-enters IN_PROGRESS
       when the next agent is assigned, so a three-role tier crosses the transition three
       times. Correct for a status feed, wrong for a milestone §7.6.2 promises 3–4 of. Fixed by
       guarding on a task already SUBMITTED/APPROVED — the difference between work starting and
       work continuing, needing no column. Both unit suites now pin it; the positive case had
       to move to the task service, because a rejection requires a SUBMITTED task and so can
       only ever be work continuing."
    - "**D79 — a design tension the tests surfaced.** Two existing engine tests failed when the
       delegate branch answered an unlinked status query with third-party copy. The signal was
       real: §7.4.3 (offer linking) and §7.4.5 (name the delegate route) describe the *same*
       inbound message, and the bot cannot tell a customer on a second handset from a stranger.
       Guessing is wrong both ways. Resolved by one message naming both routes, and
       `content.third_party_enquiry()` was deleted rather than left as a second answer."
    - "The decorated-service guard earned its keep again: `status_label_for` shipped as a
       synchronous public method on a `decorate_all_methods` class and was caught before it
       could silently return an un-awaited coroutine. Moved to module level, where it belongs
       anyway — it is pure."
    - "Kink memoizes a resolved singleton, so `monkeypatch.setitem(di._services, T, mock)`
       loses to an instance an earlier test already built. `test_milestones.py` patches the
       **class** instead; the console-sender test's DI swap works only because nothing had
       resolved that class yet, which is order-dependent."
    - "Reported, not fixed (outside scope): `appodus_utils/domain/webhook/google_drive/` is dead
       and broken — its repo/service/validator import modules that do not exist, and only its
       model imports cleanly, registering an orphan `g_drive_webhook_subscriptions` table with
       no migration builder. Nothing in the app's import graph reaches it. Logged in progress.md."

