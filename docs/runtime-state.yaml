  findings:
    - "S4 gates green: backend 1227 unit tests, ruff + mypy clean; frontend 509 unit tests,
       eslint clean, next build ok. Full drive-through (all 18 stages): ALL PASSED."
    - "Migration 0004 verified three ways against live Postgres — additive on an
       already-migrated schema, full chain on a fresh database, and a downgrade/re-upgrade
       round trip; the in-place result is column-for-column identical to the fresh chain.
       Both 1:1 constraints were shown to reject a duplicate, and two released (NULL)
       numbers were shown to coexist — the property that lets a number move accounts."
    - "The live run found a defect stack no unit test could: the entire WhatsApp *outbound*
       path had never executed. Four independent faults — `render_whatsapp_payload` passed
       `template_name=` to a parameter called `template`; its result was never awaited; it
       JSON-parsed plain-text templates; and `MessageRequestRecipient.phone_digits` did not
       exist. `_build_requests_for_channels` swallows per-channel build errors, so every
       WhatsApp send in the system (including the pre-existing `new_user_welcome`) had been
       failing as a logged 'partial failure' nobody read. All four fixed, with a test that
       renders every committed WhatsApp template and builds a real request."
    - "Also fixed: `whatsapp/new_user_welcome.jinja2` carried an email `Subject:` header as
       its first line — invisible while the path was dead, a visible bug the moment it ran."
    - "`PhoneInputWithCountry` was bound to one form's shape (`UseFormReturn<VerifyFormValues>`),
       which had already forced a `form as never` cast at one of its two call sites. Made it
       value-controlled and updated all three consumers; the cast is gone."
    - "e2e determinism: the whatsapp stage now uses a per-run number. OTP resend counters live
       in Redis/KV keyed on the *number*, which `/dev/reset` does not clear, so a fixed number
       failed the second run inside the lockout window on an unrelated rate limit."
    - "Two ops_unhappy failures on one full run were a pre-existing race, not a regression: the
       dev server's own 15-minute APScheduler no-show sweep fired 28 seconds before the stage's
       manual sweep and consumed the seeded task. Restarting the backend (fresh tick) → ALL PASSED."
    - "Deferred by design: Meta-approved template sends (`template_name` + positional
       `template_variables`) are S8's, with the §7.7 registry. Until then WhatsApp goes out as
       text — accepted by the Cloud API only inside the 24-hour window. TODO(gap) marked."
    - "Deferred by design: the bot-side half of WA-24 (resuming the conversation after a link
       completes) is S5's, and short-code resolution (WA-22/WA-21) is S6's."

