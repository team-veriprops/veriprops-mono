# ── S16 (Phase 12) summary ────────────────────────────────────────
s16_notifications_event_bus:
  backend:
    - "app/core/events/: §4.8 in-process synchronous EventBus (DomainEvent + EventType full §12.2 set;
       publish once, best-effort per subscriber). publish_domain_event helper. Three subscribers
       registered at bootstrap: realtime_subscriber (re-emits the EXACT S13 verification SSE event name —
       frontend hooks untouched, D15/D20), notification_subscriber (rule-table fan-out), chat_counter_
       subscriber (per-user Chat counter for MESSAGE_SENT, §12.3). DomainEvent.type is Optional so a pure
       SSE-refresh nudge carries only sse_event (no notification)."
    - "notification/ domain: Notification entity + feed (paged) + unread counter + mark-read/all.
       rules.py = the single declarative Chat-vs-Notification rule table (full §12.2; MESSAGE_SENT is
       chat_only → Chat counter only, never a notification — FR-6/7). content.py = backend-owned copy +
       deep links. dispatcher.py (NotificationDispatcher extends BaseMessageSender) sends the template on a
       computed channel set. notification_preference/ domain: per-event email/SMS opt-out (in-app never
       disableable). Endpoints /notifications/* + /notification-preferences."
    - "REFACTOR (D20): every publish_verification_event(...) call (review/task/verification services)
       now publishes a DomainEvent once → realtime_subscriber re-emits the SSE. Notification-worthy events
       carry the customer recipient + type (PAYMENT_CONFIRMED at PAID, STATUS_CHANGED on derive, REPORT_READY
       at release). The direct send_report_ready call is removed — the notification subscriber dispatches it.
       Chat delivery publishes MESSAGE_SENT through the bus (chat_counter_subscriber pushes the counter)."
    - "SLA-breach sweep (D23): SlaMonitorService.sweep_sla_breaches publishes SlaBreached once per newly-
       overdue verification (idempotent on an existing SLA-breach notification). Wired into the S10
       scheduler (SlaMonitorJobs, ALWAYS_NEW, 30-min interval, disabled under test) + admin dev endpoint
       /admin/verifications/sweeps/sla-breach. 2 tables folded into 0001 (round-trip clean)."
  frontend:
    - "types/notification; notification-service + useNotificationQueries (+useNotificationRealtime SSE →
       invalidate counter/feed). Real NotificationBell (replaces the stub): counter (9+ cap, hidden at 0) +
       dropdown (recent + mark-all + View all) → /portal/notifications history. Notification-preferences
       page (portal + agent) with per-event email/SMS toggles (in-app locked on). Reuses the S15 useUserStream."
  tests:
    written: true
    executed: true
    passing: true   # backend 644 (+17: event bus fan-out/best-effort, rule routing, notification service
                    #   opt-out, subscriber SSE-name preservation, SLA sweep idempotency); frontend 299
                    #   (+3 notification-service contract). migration round-trip clean; tsc+lint clean.

