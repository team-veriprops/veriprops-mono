self_audit:
  started: false
  completed: false
  findings:
    - "S5 shipped 2026-09-01 (ef59aca) — drive-through green at 306 checks."
    - "D69 (user): chat intake collects into the bot session; identity happens at the pay landing.
       Accepted cost: an abandoned chat intake leaves no row in `verifications`, so it is invisible
       to the console and to the §17.1 recovery sweep. The conversation itself is still in the
       console."
    - "D70 (user): chat asks only what the web wizard gates on; §5.1's conditional facts stay on
       the web. Handing into the existing wizard is what makes this cheap — no chat-specific
       consent or payment surface exists to keep in sync."
    - "D71: `intake` is a third handoff-token shape, phone-scoped like `link`. The collected
       answers stay server-side; the token carries none of them."
    - "**A third instance of the same bug class**: a synchronous public method on a
       `decorate_all_methods` class returns an un-awaited coroutine and silently does nothing.
       `seed_draft_payload` was `def`, so a customer's chat answers never reached their draft —
       the drive-through caught it; the unit test had mocked the service and could not.
       `decorate_all_methods` now records which methods it wrapped that were not already
       coroutines, and `test_decorated_service_contract.py` fails on any of them. A census across
       143 decorated services found **zero** remaining, so the guard starts clean."
    - "The `AuthJWT` dependency declares a header parameter named `token`; a path param of the
       same name makes FastAPI refuse to build the route. `/wa/intake/{handoff_token}/redeem`."
    - "S7 closed the live defect logged between S5/S6 and S7: an agent's console reply was stored
       and never delivered. The seam is `ChatMessageService._deliver_effects`, not `post_message`,
       because both `send` and `approve` pass through it — so a fraud-held agent reply cannot reach
       the customer's phone before an admin clears it, and that falls out of the design rather than
       needing a second guard."
    - "D72: outside Meta's window an agent's words are **queued** (`chat_messages.channel_delivered_at`
       null) and flushed on the customer's next inbound, with `window_reopen` sent once per closed
       episode. Nudge-only would have dead-ended the thread: it is sticky-`HUMAN` by then (D57), so
       the bot would not answer the customer's reply to the nudge either."
    - "D73: `unofficial_media` is **derived** from `media_kind`, never stored. The evidence rule says
       chat media is never canonical, so a persisted boolean could only ever drift from the rule it
       is meant to express. WA-06's 'never enters the verification file' is structural — no path
       links a chat message to evidence — and is guarded by an explicit test rather than by absence."
    - "D74: an `upload` token names a customer *and* a case, so §7.6.3's document row splits three
       ways — one open case issues the link, several ask which (reusing the status flow's list and
       matcher), and unlinked or none states the evidence rule with no link at all."
    - "Reported, not fixed (outside scope): `appodus_utils/domain/webhook/google_drive/` is dead
       and broken — its repo/service/validator import modules that do not exist, and only its
       model imports cleanly, registering an orphan `g_drive_webhook_subscriptions` table with no
       migration builder. Nothing in the app's import graph reaches it. Logged in progress.md."

