# ── S12 (Phase 8) summary ─────────────────────────────────────────
s12_review_release:
  backend:
    - "Trust Score Weights domain (verification/scoring): trust_score_weight_config table
       (tier×role, sum-to-100 enforced per tier), idempotent default seed via DataSeeder,
       admin CRUD /admin/trust-score-weights (D14), deterministic compute_composite = Σ
       (weight/100 × per-task quality)."
    - "Report domain (verification/report): versioned Report entity (report_version — NOT the
       optimistic-lock version), ReportState DRAFT→RELEASED→SUPERSEDED. ReportService.release
       supersedes the live version and creates the next (§8.6); supersede_current on reopen."
    - "Review service (verification/review) = the release gate (§8). approve_task RECORDS admin
       intent + a quality score WITHOUT changing task state (stays SUBMITTED) — so all-approved
       never auto-completes; reject_task SUBMITTED→REJECTED (derive→IN_PROGRESS rework). release
       requires UNDER_REVIEW + every required task review-approved + no HIGH conflict; flips all
       SUBMITTED→APPROVED atomically (derive→COMPLETED exactly at release), accrues CLEARING
       commissions (price×weight×AGENT_COMMISSION_SHARE, D13), computes composite, creates the
       RELEASED report. reopen_task APPROVED→IN_PROGRESS + supersede. fail → FAILED + gateway
       refund (PaymentService.refund, stub default; PaymentStatus.REFUNDED added)."
    - "Conflict detection (review/conflict.py): pure §8.2 rules (registry-encumbrance vs lawyer-
       proceed = HIGH; high legal risk = MEDIUM). Admin endpoints /admin/review/* (RBAC). New
       task columns review_decision/review_quality; trust_score_weight_config + reports tables
       folded into 0001 (round-trip clean)."
  frontend:
    - "types/adminReview.ts; review-service + trust-weight-service + useReviewQueries. Report
       review at /admin/verifications/[id]/report-review: per-task approve(quality)/reject(reason)/
       reopen, conflict banners, projected trust score, findings JSON, release (gated on releasable)
       + fail&refund. Trust Score Weights CRUD at /admin/config/trust-score-weights (per-tier edit,
       live sum-to-100 validation). 'Report review' CTA on the admin verification detail; nav item."
  tests:
    written: true
    executed: true
    passing: true   # backend 533 (+18: scoring, conflict, review services); frontend 273 (+3
                    #   review + trust-weight contract). migration round-trip clean; tsc+lint clean.

