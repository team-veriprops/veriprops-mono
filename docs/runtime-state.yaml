    - "Resumed 2026-09-01 to implement S5-S9 in one pass, one commit per slice (user-chosen
       cadence). Gate decisions D62-D68 recorded before coding."
    - "D62 (user): the /wa/pay landing carries VERIFICATION_TERMS + the two §7.4.6 opt-ins and
       submits the case on the D51 grant - D56 read against the code leaves no other place for
       consent that keeps a WhatsApp-only customer able to finish."
    - "D63 (user): a WhatsAppConsent entity, not a notification_preferences column - §7.8 wants
       timestamps and provenance, which the per-event preference model has neither of."
    - "D64 (user): STOP revokes both consents; START restores utility only."
    - "D65: NotificationRule gains whatsapp + a distinct whatsapp_template; the recipient is the
       LINKED number, never user.phone; delegates are a separate audience."
    - "D66: VERIFICATION_STARTED and INSPECTION_COMPLETE become real events rather than a
       subscriber sniffing another event's data dict."
    - "D67: CaseDelegate carries its own phone; resolution order is linked account, then delegate."
    - "D68: G1 support hours are system_config ConfigKeys, seeded additively."
    - "S5 amends D48's 'zero dependencies': the Claude adapter uses the official `anthropic` SDK
       (version headers, typed errors, retries on a live customer path). The generic adapter stays
       raw httpx. Recorded in the decision log under D53."
    - "S5 drive-through found a latent bug outside the slice: `UpsertMessageDto.from_request`
       rejected any `MessageRequest` built by direct construction rather than the builder, because
       `model_dump` emits an explicit `extras=None` and pydantic applies a default only for an
       absent key. It failed silently (logged, swallowed) - the bot's first reply was never
       delivered. Fixed at the seam + regression-tested for both construction routes."
    - "S5 drive-through found a second latent bug: `CommunicationService.post_message` was the
       only chat path that did not grant admins the shared inbox, so a WhatsApp thread was
       readable from the console and unanswerable - and D57's take-over, which fires on a human
       reply, could never have run in production. `list_conversations`/`mark_read`/`list_messages`
       already special-cased admins; the write path now does too."
    - "S5 self-audit found a third: the stub classifier never emits the keyword-only intents, so a
       customer texting STOP got 'sorry, I didn't quite get that'. STOP/START and quoted `VP-…`
       references are now matched on literal words ahead of the classifier and routed to a person
       until S6/S8 build the real flows."
    - "`decorate_all_methods` wraps @staticmethod too - a pure mapper on a decorated service
       returns a coroutine and 500s at runtime while every log line reads as success. Session DTO
       mapping moved to a module-level function; regression-tested."
    - "D57's sticky-HUMAN mode needed both halves shipped together: `CommunicationService.post_message`
       flips a WhatsApp thread when an admin/agent posts, and the new `/admin/messages` WhatsApp tab
       carries the hand-back control. Without the control the first agent reply would silence a
       customer's thread permanently."

